; OniMP - a copier a cote d'Oni.exe (install.bat le fait s'il n'existe pas).
; La variable d'environnement ONIMP est prioritaire sur [net] mode/host/port :
;   ONIMP=host:27777     ONIMP=connect:192.168.1.10:27777     ONIMP=join     ONIMP=off

[net]
; off | host | client
mode = off
; mode client : adresse de l'hote, ou "auto" pour le chercher sur le reseau et le rejoindre
host = 127.0.0.1
; port UDP de la partie ; l'hote s'annonce sur le port suivant (27778)
port = 27777
; hote : nom de la partie annoncee sur le reseau
name = Oni
; client avec host = auto : ne rejoindre que la partie de ce nom (vide : la premiere trouvee)
join =
; reseau ou l'hote s'annonce et d'ou chacun accepte l'autre :
;   auto     Radmin VPN (26.x.x.x) s'il est connecte, sinon toutes les interfaces
;   radmin   Radmin VPN seulement
;   any      toutes les interfaces
;   a.b.c.d  l'interface qui porte cette adresse
interface = auto
; envois par seconde (5 a 120)
rate = 30

[player]
; classe de personnage (ONCC) utilisee pour afficher l'autre joueur
class = konoko_generic

[sync]
; PNJ pilotes par l'hote (experimental). A activer des deux cotes, une fois la
; synchronisation des joueurs validee.
npcs = false
; cote client : supprime les PNJ que l'hote ne connait pas
delete_orphans = true
; "quetes" (experimental) : les scripts de niveau ne produisent d'effets que chez l'hote, qui
; les transmet au client (objectifs, portes, spawns, dialogues). Active aussi npcs.
; A activer des deux cotes. Cote client, le niveau reste inerte tant que l'hote n'est pas la.
quests = false

[game]
; Oni refuse normalement de se lancer deux fois. Necessaire pour tester hote + clients
; sur la meme machine.
allow_multiple_instances = true
; hote, avec des PNJ partages : "degats en ligne". Les PNJ frappent 5 % plus fort par client
; present (leur vie, elle, compte toujours une fois de plus par client). false : degats normaux.
; Se regle aussi en jeu, onglet Coop du menu F1 de l'hote, qui reecrit cette ligne.
; Les pourcentages eux-memes sont dans onimp_difficulty.ini.
online_damage = true
; hote : mode de difficulte de la partie. Se regle en jeu, onglet Coop du menu F1 de l'hote, qui
; reecrit cette ligne ; les clients le suivent.
;   easy      ennemis du mode facile du jeu ; joueur a terre : 35 s pour le ranimer, releve a 45 %
;   normal    ennemis du mode normal ;                         25 s,                 releve a 40 %
;   hard      ennemis du mode difficile ;                      10 s,                 releve a 35 %
;   survival  ennemis du mode difficile, vie et degats x1,5, qui se soignent (+1 point par seconde,
;             +2 pour un boss) ;                                5 s,                 releve a 25 %
difficulty = normal
; hote : multiplicateur d'ennemis, de 1 a 4. Chaque ennemi ordinaire du niveau arrive avec ce
; nombre de copies moins une (jamais les boss ni les personnages dont un script du niveau depend).
; A plusieurs il ne descend pas sous le nombre de joueurs : x2 a deux, x3 a trois, x4 a quatre.
; Se regle aussi dans l'onglet Coop.
enemies = 1
; hote : des civils se melent aux ennemis dans les niveaux ou ils ont leur place (aeroport,
; bureaux, laboratoires). Si un joueur en tue un, la mission echoue et reprend a la derniere
; sauvegarde. Se regle aussi dans l'onglet Coop.
civilians = true
; en session, des qu'un autre joueur est relie, le jeu ne se met plus en pause derriere les menus
; (F1, Echap, ecran d'une console) : les menus s'ouvrent comme avant, le monde continue de tourner
; derriere. Evite que les PNJ se figent chez tout le monde quand l'hote ouvre un menu. false : le
; jeu se met en pause derriere les menus, comme en solo.
run_in_menus = true
; hote : quand un joueur arrive en cours de niveau, tout le monde repart du dernier point de
; sauvegarde de l'hote apres un compte a rebours de cinq secondes, et le nouveau venu commence sans
; armes. false : il garde le niveau qu'il a charge, comme avant la 0.22.
join_reload = true
; apres un chargement de niveau, la partie reste en pause jusqu'a ce que tous les joueurs l'aient
; charge, puis demarre chez tous en meme temps, sans touche a presser. false : chacun demarre des
; qu'il a charge.
ready_check = true

[display]
; reglages de chaque joueur, sur sa machine seulement. Ils se changent en jeu, onglet Display du
; menu F1, et sont gardes ici : l'hote ecrit dans cette section, un client dans [display_client]
; (les memes cles). Les deux peuvent ainsi partager ce fichier sur une meme machine sans se defaire
; l'un l'autre ; ce qu'un client n'a pas encore regle lui-meme vaut ce que dit cette section.
; jauges de vie au-dessus des personnages :
player_health = true
npc_health = true
; messages du mod a l'ecran, en haut a droite et en vert. false : ils ne vont plus qu'au journal.
messages = true
; identifiants : le nom de chaque PNJ au-dessus de sa jauge, celui de chaque arme au sol au-dessus
; d'elle. Ce sont les noms qu'attendent les commandes de script.
npc_ids = true
weapon_ids = true
; reserves de chaque autre joueur au-dessus de sa jauge : une rangee de six cases carrees, rouge
; par chargeur de balles depuis la gauche, verte par cellule d'energie depuis la droite.
player_ammo = true
; latence de chaque autre joueur, en millisecondes, a cote de son pseudo.
ping = true
; langue des textes du mod a l'ecran (messages, menu F1, panneau d'un joueur a terre) : fr ou en.
; Se change en jeu, onglet Display, bouton Language, et prend effet aussitot. Le journal reste en
; francais.
language = fr
; les autres joueurs vus a travers les murs (jauge, munitions, pseudo, panneau d'un joueur a
; terre). false : ils ne se voient plus que lorsque le joueur lui-meme est en vue. Bouton
; Wallhack (ESP) de l'onglet Display, commande mp_wallhack 0 / 1.
wallhack = true
; portraits des personnages qui parlent pendant les dialogues : en bas de l'ecran, a gauche ou a
; droite, juste au-dessus des sous-titres (true), ou en haut comme dans le jeu d'origine (false).
; En session seulement. Bouton Low portraits de l'onglet Display, commande mp_portraits 0 / 1.
portraits_bottom = true

[game_client]
; client seulement : jeu automatique. Son personnage suit l'hote et se bat seul. Bouton Auto-play
; de l'onglet Coop du menu F1 du client, commande mp_autoplay 0 / 1.
autoplay = false

[audio]
; volume du son joue une fois quand un joueur tombe a terre, chez tous les joueurs : de 0 a 100,
; 0 pour le couper. Curseur Alert volume de l'onglet Coop du menu F1, chez l'hote comme chez un
; client (qui l'ecrit sous [audio_client]). Commande : mp_alertvolume 0 a 100.
; Fichier : onimp_alert.mp3 a cote d'Oni.exe (install.bat l'y copie), ou OniMP\sounds\AlertFall.mp3.
; Ne s'entend que dans la fenetre du jeu qui a le clavier.
alert_volume = 50

[cheats]
; Onglets Cheat, Character et Spawn du menu F1 (depuis la 0.35). Tout se regle dans le menu, qui
; reecrit ces lignes ; un client ecrit les siennes sous [cheats_client].
; Deux reglages de l'hote, sous [game] :
;   cheats = true | false      interrupteur general (bouton Cheats de l'onglet Cheat) ; coupe : plus
;                              aucun cheat n'agit, chez personne
;   cheat_access = 0 a 14      clients a qui l'hote ouvre les trois onglets : 2 pour le joueur 1,
;                              4 pour le joueur 2, 8 pour le joueur 3, additionnes
; Les cheats de ce joueur, qui n'agissent que sur son personnage :
god_mode = false
unlimited_ammo = false
one_hit_kill = false
permanent_aura = false
; en pour cent : 100, comme dans le jeu ; jusqu'a 300 (attaque, deplacement) et 400 (saut).
; Saut au-dessus de 100 : plus de degats de chute.
attack_speed = 100
move_speed = 100
jump = 100
; classe du personnage incarne a la place de Konoko (vide : Konoko), et touche « personnage
; suivant », de F5 a F12
character =
character_key = F5

[debug]
; ecrit une ligne d'etat par seconde dans onimp_<mode>.log
trace = false
