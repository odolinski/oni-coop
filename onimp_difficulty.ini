; OniMP - difficulte selon le nombre de clients connectes a l'hote.
; A copier a cote d'Oni.exe (install.bat le fait s'il n'existe pas).
;
; Le plus simple : en jeu, menu F1 de l'hote, onglet Coop, curseurs "NPC health" et "NPC damage".
; Ils reecrivent les six valeurs ci-dessous, du meme pas pour un, deux et trois clients.
;
; A la main, c'est ICI que la difficulte se regle, pas dans le code source : chaque ligne de ce
; fichier passe avant les valeurs de src\difficulty.cpp, qui ne servent que pour une ligne absente.
;
; Lu par l'hote seulement : les clients recoivent de lui ce qu'il en tire. Relu des qu'il est
; enregistre, meme en pleine partie (l'hote le regarde une fois par seconde) : pas besoin de
; relancer le jeu ni de recharger le niveau. La console de l'hote le confirme ("OniMP : difficulte
; relue : ..."), son journal aussi (ligne "difficulte :"), et
; OniMP\build\onimp_difficultytest.exe <ce fichier> affiche les valeurs sans lancer le jeu.
;
; Ne vaut qu'avec des PNJ partages (run_host_npcs, run_host_coop, run_host_radmin). Sans client
; connecte, tout reste a la valeur d'origine du jeu.
;
; Toutes les valeurs sont des pourcentages de la valeur d'origine :
;   100 = inchange     200 = le double     50 = la moitie
; clients_1 : un client connecte (deux joueurs), clients_2 : deux clients, clients_3 : trois.

[health]
; vie des PNJ, boss compris. De 10 a 2000.
clients_1 = 200
clients_2 = 300
clients_3 = 400

[damage]
; degats des PNJ sur les joueurs. De 0 a 1000.
; Ne s'appliquent que si "Online damage" est sur ON dans l'onglet Coop du menu F1 de l'hote
; (online_damage = true dans onimp.ini) ; sur OFF, les PNJ font leurs degats d'origine quelles que
; soient ces valeurs, et la console dit "degats normaux, Online damage sur OFF".
clients_1 = 105
clients_2 = 110
clients_3 = 115
